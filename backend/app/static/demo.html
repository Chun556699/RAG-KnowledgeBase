<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG-KB 挂件演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #ecfdf5 100%);
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 44px; max-width: 640px;
      box-shadow: 0 12px 48px rgba(79, 70, 229, .10); border: 1px solid #e8eaf6;
    }
    h1 { font-size: 26px; color: #1e293b; margin-bottom: 14px; }
    p { color: #64748b; font-size: 14.5px; line-height: 1.8; margin-bottom: 10px; }
    code {
      display: block; background: #0f172a; color: #a5f3fc; border-radius: 10px;
      padding: 14px 16px; font-size: 12.5px; margin: 16px 0; overflow-x: auto;
      font-family: "JetBrains Mono", Consolas, monospace; line-height: 1.7;
    }
    .hint { font-size: 12.5px; color: #94a3b8; }
    .badge {
      display: inline-block; background: #eef2ff; color: #4f46e5; font-size: 12px;
      padding: 3px 10px; border-radius: 999px; margin-bottom: 16px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Demo</div>
    <h1>嵌入聊天挂件演示</h1>
    <p>本页右下角的聊天气泡即为可嵌入任意产品的问答挂件（Vanilla JS + Shadow DOM，零依赖、样式隔离）。</p>
    <p>任意网页集成只需一行脚本：</p>
    <code>&lt;script src="<span id="src"></span>/embed/widget.js"<br>        data-key="ak_live_&lt;你的密钥&gt;"<br>        data-title="智能助手" async&gt;&lt;/script&gt;</code>
    <p class="hint">演示页通过 URL 参数 <b>?key=ak_live_xxx</b> 传入密钥后加载挂件；未提供密钥时挂件不会启动。</p>
  </div>
  <script>
    document.getElementById("src").textContent = location.origin;
    var key = new URLSearchParams(location.search).get("key");
    if (key) {
      var s = document.createElement("script");
      s.src = location.origin + "/embed/widget.js";
      s.setAttribute("data-key", key);
      s.async = true;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
