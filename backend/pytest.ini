[pytest]
# ============================================================
# pytest 配置
# ============================================================
# asyncio_mode=auto: 无需为每个异步测试手动加 @pytest.mark.asyncio
# pythonpath=.     : 将 backend 根目录加入导入路径，保证 `import app` 可用
# testpaths        : 测试用例目录
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
